name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk LF02S_EQ_Controller.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LF02S_EQ_Controller
        path: LF02S_EQ_Controller.apk

    - name: Release APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0.0"
        name: "LF02S EQ Controller v1.0.0"
        body: "APK สำหรับติดตั้งในมือถือ Android เพื่อควบคุมบอร์ด LF02S (BP1032A2) ผ่านสาย Type-C"
        files: LF02S_EQ_Controller.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
